<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <title>Diseñador Neón Pro</title>
    <style>
        body { background: #080808; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; overflow-x: hidden; }
        #plano {
            width: 600px; height: 600px;
            background-image: linear-gradient(#333 1px, transparent 1px), linear-gradient(90deg, #333 1px, transparent 1px);
            background-size: 30px 30px; 
            border: 4px solid #f0f; box-shadow: 0 0 20px #f0f;
            position: relative; margin-top: 20px; cursor: crosshair;
        }
        .objeto {
            position: absolute; width: 28px; height: 28px; cursor: pointer;
            transition: transform 0.3s ease; display: flex; align-items: center; justify-content: center;
        }
        .cuadrado { border-radius: 2px; background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(0,0,0,0.3) 100%); box-shadow: inset 2px 2px 5px rgba(255,255,255,0.3), inset -2px -2px 5px rgba(0,0,0,0.5); border: 1px solid rgba(0,0,0,0.2); }
        .circulo { border-radius: 50%; box-shadow: 0 0 10px currentColor; }
        .triangulo { background: transparent !important; box-shadow: none !important; border-bottom: 28px solid currentColor; border-right: 28px solid transparent; width: 0; height: 0; }
        .toolbar { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; background: #1a1a1a; padding: 15px; border-radius: 8px; align-items: center; }
        .fila { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .btn-color { width: 30px; height: 30px; border: 2px solid #555; cursor: pointer; border-radius: 4px; }
        .btn { padding: 10px 15px; cursor: pointer; border: 1px solid #444; color: white; background: #333; font-weight: bold; }
        .btn-parar { background-color: maroon; border-color: red; }
        .btn-continuar { background-color: green; border-color: lime; }
        .contador { font-size: 1.5em; font-weight: bold; color: magenta; margin: 0 10px; }
        .contador-parado { color: red; }
    </style>
</head>
<body>
    <h1>DISEÑADOR NEÓN PRO</h1>
    <div class="toolbar">
        <div class="fila">
            <div class="btn-color" style="background: orange;" onclick="setMode('muro', 'orange', 'cuadrado')"></div>
            <div class="btn-color" style="background: red;" onclick="setMode('mueble2', 'red', 'cuadrado')"></div>
            <div class="btn-color" style="background: maroon;" onclick="setMode('puerta', 'maroon', 'cuadrado')"></div>
            <div class="btn-color" style="background: skyblue;" onclick="setMode('ventana', 'skyblue', 'cuadrado')"></div>
            <div class="btn-color" style="background: yellow;" onclick="setMode('mueble', 'yellow', 'cuadrado')"></div>
            <div class="btn-color" style="background: blue;" onclick="setMode('mueble1', 'blue', 'cuadrado')"></div>
            <button class="btn" onclick="setMode('planta', 'green', 'circulo')">Círculo</button>
            <button class="btn" onclick="setMode('triangulo', 'white', 'triangulo')">Triángulo</button>
            <select id="formaSelector"><option value="cuadrado">Cuadrado</option><option value="circulo">Círculo</option><option value="triangulo">Triángulo</option></select>
            <input type="color" id="colorPicker" value="#ffffff">
        </div>
        <div class="fila">
            <div class="contador" id="contador">00:00:00</div>
            <button class="btn btn-parar" onclick="pararContador()">Parar</button>
            <button class="btn btn-continuar" onclick="continuarContador()">Continuar</button>
            <button class="btn" onclick="location.reload()">Reiniciar</button>
            <button class="btn" onclick="guardarDiseno()">Guardar</button>
            <button class="btn" onclick="cargarDiseno()">Cargar</button>
            <button class="btn" onclick="toggleGrid()">Grilla</button>
            <button class="btn" onclick="descargarDiseno()">Exportar PNG</button>
        </div>
    </div>
    <div class="instrucciones">Clic/Toque: Colocar | Clic simple: Girar | SHIFT+Clic: Color | <b>Doble clic/toque: Borrar</b></div>
    <div id="plano"></div>

    <script>
        const plano = document.getElementById('plano');
        let modo = { tipo: 'muro', color: 'orange', forma: 'cuadrado' };
        let tiempo = 0, intervalo, corriendo = true;
        let lastTap = 0;

        function setMode(t, c, f) { modo.tipo = t; modo.color = c; modo.forma = f; document.getElementById('colorPicker').value = c; document.getElementById('formaSelector').value = f; }
        
        // Control Tiempo
        function actualizarContador() { tiempo++; document.getElementById('contador').innerText = new Date(tiempo * 1000).toISOString().substr(11, 8); }
        function pararContador() { clearInterval(intervalo); corriendo = false; document.getElementById('contador').classList.add('contador-parado'); }
        function continuarContador() { if (!corriendo) { intervalo = setInterval(actualizarContador, 1000); corriendo = true; document.getElementById('contador').classList.remove('contador-parado'); } }
        intervalo = setInterval(actualizarContador, 1000);

        function toggleGrid() { plano.style.backgroundImage = (plano.style.backgroundImage === 'none') ? 'linear-gradient(#333 1px, transparent 1px), linear-gradient(90deg, #333 1px, transparent 1px)' : 'none'; }
        
        function configurarObjeto(obj) {
            obj.onclick = (e) => {
                e.stopPropagation();
                if (e.shiftKey) obj.style.backgroundColor = obj.style.borderBottomColor = document.getElementById('colorPicker').value;
                else { let r = (parseInt(obj.dataset.rot) || 0) + 90; obj.style.transform = `rotate(${r}deg)`; obj.dataset.rot = r; }
            };
            obj.ontouchstart = (e) => {
                let currentTime = new Date().getTime();
                if (currentTime - lastTap < 300) obj.remove();
                lastTap = currentTime;
            };
            obj.ondblclick = () => obj.remove();
        }

        function guardarDiseno() {
            let d = [];
            document.querySelectorAll('#plano .objeto').forEach(o => d.push({ left: parseInt(o.style.left), top: parseInt(o.style.top), color: o.style.backgroundColor || o.style.borderBottomColor, forma: o.className.replace('objeto ', ''), rot: o.dataset.rot || 0 }));
            localStorage.setItem('miDisenoNeon', JSON.stringify(d));
            alert("Guardado!");
        }

        function cargarDiseno() {
            const data = localStorage.getItem('miDisenoNeon');
            if (!data) return;
            let items = JSON.parse(data);
            const anchor = items[0];
            const temp = document.createElement('div');
            temp.style.position = 'absolute'; temp.style.pointerEvents = 'none';
            plano.appendChild(temp);
            items.forEach(i => {
                const o = document.createElement('div'); o.className = 'objeto ' + i.forma;
                o.style.left = (i.left - anchor.left) + 'px'; o.style.top = (i.top - anchor.top) + 'px';
                o.style.transform = `rotate(${i.rot}deg)`;
                if (i.forma.includes('triangulo')) o.style.borderBottomColor = i.color; else o.style.backgroundColor = i.color;
                temp.appendChild(o);
            });
            const move = (e) => { const r = plano.getBoundingClientRect(); temp.style.left = (e.clientX - r.left) + 'px'; temp.style.top = (e.clientY - r.top) + 'px'; };
            document.addEventListener('mousemove', move);
            plano.onclick = (e) => {
                document.removeEventListener('mousemove', move);
                const r = plano.getBoundingClientRect();
                const mx = Math.round((e.clientX - r.left) / 30) * 30, my = Math.round((e.clientY - r.top) / 30) * 30;
                Array.from(temp.children).forEach(o => {
                    const n = o.cloneNode(true);
                    n.style.left = (parseInt(o.style.left) + mx) + 'px'; n.style.top = (parseInt(o.style.top) + my) + 'px';
                    n.style.pointerEvents = 'auto'; configurarObjeto(n); plano.appendChild(n);
                });
                temp.remove(); plano.onclick = crear;
            };
        }

        function descargarDiseno() {
            const clon = plano.cloneNode(true);
            clon.style.background = 'transparent'; clon.style.backgroundImage = 'none'; clon.style.border = 'none'; clon.style.boxShadow = 'none';
            document.body.appendChild(clon);
            html2canvas(clon, { backgroundColor: null }).then(c => {
                const a = document.createElement('a'); a.download = 'diseno.png'; a.href = c.toDataURL('image/png'); a.click();
                document.body.removeChild(clon);
            });
        }

        let crear = (e) => {
            if (e.target !== plano || !corriendo) return;
            const o = document.createElement('div');
            o.className = 'objeto ' + document.getElementById('formaSelector').value;
            let col = document.getElementById('colorPicker').value;
            if (o.classList.contains('triangulo')) o.style.borderBottomColor = col; else o.style.backgroundColor = col;
            o.style.left = Math.floor((e.pageX - plano.offsetLeft) / 30) * 30 + 'px';
            o.style.top = Math.floor((e.pageY - plano.offsetTop) / 30) * 30 + 'px';
            configurarObjeto(o); plano.appendChild(o);
        };
        plano.onclick = crear;
    </script>
</body>
</html>
