<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Pagos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial; margin: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f2f2f2; }
        .pagado { color: green; font-weight: bold; }
        .pendiente { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Reporte de Pagos - Estudiantes</h2>
    <table>
        <thead>
            <tr>
                <th>Estudiante</th>
                <th>Sección</th>
                <th>Estado</th>
                <th>Comprobante</th>
            </tr>
        </thead>
        <tbody id="tablaReporte"><tr><td colspan="4">Cargando...</td></tr></tbody>
    </table>

    <script>
        const sb = supabase.createClient('https://viozqipplhkcxacpryrr.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpb3pxaXBwbGhrY3hhY3ByeXJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3ODMwMjUsImV4cCI6MjA5NzM1OTAyNX0.j8Qc-tVeIJH_4_UvwJtZhIqNcbSJ2zsZia6UpwPyuFA');

        async function cargarReporte() {
            const { data: ests } = await sb.from('Estudiantes').select('Nombres, Seccion');
            const { data: pags } = await sb.from('Pagos').select('nombre_estudiante, url_foto');
            
            const tbody = document.getElementById('tablaReporte');
            tbody.innerHTML = "";

            ests.forEach(e => {
                const nombre = e.Nombres.trim();
                const pago = pags.find(p => p.nombre_estudiante && p.nombre_estudiante.trim() === nombre);
                
                // URL de la foto en el Storage
                const urlFoto = pago ? `https://viozqipplhkcxacpryrr.supabase.co/storage/v1/object/public/comprobantes/${pago.url_foto}` : "#";

                tbody.innerHTML += `<tr>
                    <td>${nombre}</td>
                    <td>${e.Seccion || "N/A"}</td>
                    <td class="${pago ? 'pagado' : 'pendiente'}">${pago ? '✅ PAGADO' : '❌ PENDIENTE'}</td>
                    <td>${pago ? `<a href="${urlFoto}" target="_blank">Ver foto</a>` : "-"}</td>
                </tr>`;
            });
        }
        cargarReporte();
    </script>
</body>
</html>
