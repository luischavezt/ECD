<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Viewport necesario para que no se vea pequeño en celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Pagos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilos optimizados para móviles */
        body { font-family: Arial, sans-serif; margin: 10px; font-size: 12px; }
        h2 { text-align: center; font-size: 20px; }
        
        /* Contenedor que permite scroll horizontal si la tabla es grande */
        .table-container { width: 100%; overflow-x: auto; }
        
        table { width: 100%; border-collapse: collapse; min-width: 400px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        th { background-color: #f2f2f2; }
        
        .pagado { color: green; font-weight: bold; }
        .pendiente { color: red; font-weight: bold; }
        
        /* Botón táctil más grande */
        a { display: block; padding: 4px; background: #eee; text-decoration: none; border-radius: 5px; color: #333; }
    </style>
</head>
<body>

    <h2>Reporte de Pagos</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Estudiante</th>
                    <th>Sección</th>
                    <th>Estado</th>
                    <th>Comprobante</th>
                </tr>
            </thead>
            <tbody id="tablaReporte"><tr><td colspan="4">Cargando...</td></tr></tbody>
        </table>
    </div>

    <script>
        const sb = supabase.createClient('https://viozqipplhkcxacpryrr.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpb3pxaXBwbGhrY3hhY3ByeXJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3ODMwMjUsImV4cCI6MjA5NzM1OTAyNX0.j8Qc-tVeIJH_4_UvwJtZhIqNcbSJ2zsZia6UpwPyuFA');

        async function cargarReporte() {
            const { data: ests } = await sb.from('Estudiantes').select('Nombres, Seccion');
            const { data: pags } = await sb.from('Pagos').select('nombre_estudiante, url_foto');
            
            const tbody = document.getElementById('tablaReporte');
            tbody.innerHTML = "";

            ests.forEach(e => {
                const nombre = e.Nombres.trim();
                const pago = pags.find(p => p.nombre_estudiante && p.nombre_estudiante.trim() === nombre);
                
                const urlFoto = pago ? `https://viozqipplhkcxacpryrr.supabase.co/storage/v1/object/public/comprobantes/${pago.url_foto}` : "#";

                tbody.innerHTML += `<tr>
                    <td>${nombre}</td>
                    <td>${e.Seccion || "N/A"}</td>
                    <td class="${pago ? 'pagado' : 'pendiente'}">${pago ? '✅ PAGADO' : '❌ PENDIENTE'}</td>
                    <td>${pago ? `<a href="${urlFoto}" target="_blank">Ver foto</a>` : "-"}</td>
                </tr>`;
            });
        }
        cargarReporte();
    </script>
</body>
</html>
