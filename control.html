<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Pagos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supahttps://viozqipplhkcxacpryrr.supabase.cobase/supabase-js@2"></script>
</head>
<body>
    <h2>Registro de Pago - Yape</h2>
    <select id="selectEstudiante"><option>Cargando...</option></select>
    <input type="file" id="fileInput">
    <button onclick="enviar()">Enviar Registro</button>
    <p id="mensaje"></p>

    <script>
    // Usamos un pequeño retraso para asegurar que la librería Supabase cargó
    window.addEventListener('load', async () => {
        // Verifica que la librería cargó
        if (typeof supabase === 'undefined') {
            console.error("La librería de Supabase no cargó. Revisa tu conexión a internet.");
            return;
        }

        const supabaseClient = supabase.createClient('TU_PROJECT_URL', 'TU_ANON_KEY');

        async function cargar() {
            const sel = document.getElementById('selectEstudiante');
            try {
                // Asegúrate que tu tabla se llame 'Estudiantes'
                const { data, error } = await supabaseClient.from('Estudiantes').select('Num, Nombres');
                
                if (error) {
                    console.error("Error de Supabase:", error);
                    sel.innerHTML = "<option>Error al cargar</option>";
                    return;
                }

                sel.innerHTML = ""; // Borrar "Cargando..."
                data.forEach(e => {
                    let o = document.createElement('option');
                    o.value = e.Num;
                    o.text = e.Nombres;
                    sel.add(o);
                });
            } catch (err) {
                console.error("Error inesperado:", err);
            }
        }
        
        cargar();
    });
	</script>
</body>
</html>
