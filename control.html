<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pagos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #34495e; }
        select, input[type="file"], button { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #219150; }
        #mensaje { text-align: center; font-weight: bold; color: #e67e22; }
        small { color: #7f8c8d; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Registro de Pago</h2>
        
        <label>Selecciona estudiante(s):</label>
        <select id="selectEstudiante" multiple style="height: 120px;"></select>
        <small><i>(Si estas en una PC, mantén presionado la tecla <b>Ctrl</b> para seleccionar varios estudiantes)</i></small>

        <label style="margin-top: 15px;">Adjuntar Comprobante:</label>
        <input type="file" id="fileInput" accept="image/*">

        <button onclick="enviar()">Enviar Registro</button>
        <p id="mensaje"></p>
    </div>

    <script>
        const supabaseClient = supabase.createClient('https://viozqipplhkcxacpryrr.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpb3pxaXBwbGhrY3hhY3ByeXJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3ODMwMjUsImV4cCI6MjA5NzM1OTAyNX0.j8Qc-tVeIJH_4_UvwJtZhIqNcbSJ2zsZia6UpwPyuFA');

       window.addEventListener('load', async () => {
			const sel = document.getElementById('selectEstudiante');
			
			// 1. Obtener lista de estudiantes (asegúrate de incluir 'Seccion')
			const { data: estudiantes, error: errorE } = await supabaseClient.from('Estudiantes').select('Num, Nombres, Seccion');
			
			// 2. Obtener lista de estudiantes que YA PAGARON
			const { data: pagos, error: errorP } = await supabaseClient.from('Pagos').select('estudiante_id');
			
			if (estudiantes) {
				const idsPagados = new Set(pagos ? pagos.map(p => p.estudiante_id) : []);
				
				sel.innerHTML = "";
				
				estudiantes.forEach(e => {
					// Solo agregar al select si NO está en la lista de pagados
					if (!idsPagados.has(e.Num)) {
						let o = document.createElement('option');
						o.value = e.Num; 
						// Aquí concatenamos el nombre con la sección
						o.text = `${e.Nombres} - ${e.Seccion}`; 
						sel.add(o);
					}
				});

				if (sel.options.length === 0) {
					sel.innerHTML = "<option disabled>Todos los estudiantes ya pagaron</option>";
				}
			}
		});

        window.enviar = async function() {
            const file = document.getElementById('fileInput').files[0];
            const sel = document.getElementById('selectEstudiante');
            const msg = document.getElementById('mensaje');
            
            // Obtener todos los seleccionados
            const seleccionados = Array.from(sel.selectedOptions).map(opt => ({
                id: opt.value,
                nombre: opt.text
            }));

            if (!file || seleccionados.length === 0) { 
                msg.innerText = "Error: Elige una foto y selecciona al menos un estudiante."; 
                return; 
            }
            
            msg.innerText = "Enviando comprobante...";

            const fileName = Date.now() + ".jpg";

            // 1. Subir la foto al Storage
            const { error: uploadError } = await supabaseClient.storage.from('comprobantes').upload(fileName, file);
            if (uploadError) { msg.innerText = "Error subiendo foto: " + uploadError.message; return; }

            // 2. Crear un registro en Pagos POR CADA estudiante seleccionado
            const registros = seleccionados.map(est => ({
                estudiante_id: est.id,
                url_foto: fileName,
                nombre_estudiante: est.nombre
            }));

            const { error: dbError } = await supabaseClient.from('Pagos').insert(registros);

            if (dbError) { 
                msg.innerText = "Error base datos: " + dbError.message; 
            } else { 
                msg.innerText = "¡Registro exitoso para " + seleccionados.length + " estudiante(s)!"; 
                document.getElementById('fileInput').value = ""; // Limpiar input
            }
        };
    </script>
</body>
</html>
