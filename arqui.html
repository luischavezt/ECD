<!DOCTYPE html>
<html lang="es">
<head>
    <style>
        body { margin: 0; background: #0f0c29; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #ui { margin-bottom: 10px; text-align: center; }
        canvas { background: #000; border: 3px solid #ff00ff; box-shadow: 0 0 30px #ff00ff; cursor: none; }
        button { padding: 8px 16px; background: #0ff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #000; }
    </style>
</head>
<body>

    <div id="ui">
        <div style="font-size: 24px; font-weight: bold;">PLAYER <span id="p1Score">0</span> | CPU <span id="cpuScore">0</span></div>
        <button onclick="resetGame()">REINICIAR PARTIDA</button>
        <p>Presiona <b>'P'</b> para Pausar</p>
    </div>
    <canvas id="gameCanvas" width="700" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let ball = { x: 350, y: 200, dx: 7, dy: 7 };
        let p1Y = 150, cpuY = 150, p1Score = 0, cpuScore = 0;
        let gamePaused = false;
        let gameOver = false;

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'p') gamePaused = !gamePaused;
            if (gameOver && e.key === ' ') resetGame();
        });

        document.addEventListener('mousemove', (e) => {
            if(!gamePaused && !gameOver) {
                let rect = canvas.getBoundingClientRect();
                p1Y = e.clientY - rect.top - 50;
            }
        });

        function update() {
            if (gamePaused || gameOver) return;

            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.y < 0 || ball.y > 400) ball.dy = -ball.dy;
            cpuY += (ball.y - (cpuY + 50)) * 0.12;

            if ((ball.x < 25 && ball.y > p1Y && ball.y < p1Y + 100) || 
                (ball.x > 675 && ball.y > cpuY && ball.y < cpuY + 100)) {
                ball.dx = -ball.dx * 1.05;
            }

            if (ball.x < 0) { cpuScore++; resetBall(); }
            if (ball.x > 700) { p1Score++; resetBall(); }

            if (p1Score >= 5 || cpuScore >= 5) gameOver = true;

            document.getElementById('p1Score').innerText = p1Score;
            document.getElementById('cpuScore').innerText = cpuScore;
        }

        function resetBall() { ball = { x: 350, y: 200, dx: (ball.dx > 0 ? -7 : 7), dy: 7 }; }
        function resetGame() { p1Score = 0; cpuScore = 0; gameOver = false; gamePaused = false; resetBall(); }

        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, 0, 700, 400);

            // Línea continua
            ctx.strokeStyle = "#444"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(350, 0); ctx.lineTo(350, 400); ctx.stroke();

            // Dibujar objetos
            ctx.fillStyle = "#0ff"; ctx.fillRect(10, p1Y, 15, 100);
            ctx.fillStyle = "#f0f"; ctx.fillRect(675, cpuY, 15, 100);
            ctx.beginPath(); ctx.arc(ball.x, ball.y, 8, 0, Math.PI*2); ctx.fill();

            // Textos de estado
            ctx.fillStyle = "white"; ctx.font = "40px Arial"; ctx.textAlign = "center";
            if (gamePaused) ctx.fillText("PAUSA", 350, 200);
            if (gameOver) ctx.fillText(p1Score >= 5 ? "¡GANASTE!" : "GAME OVER", 350, 200);
        }

        setInterval(() => { update(); draw(); }, 1000/60);
    </script>
</body>
</html>
