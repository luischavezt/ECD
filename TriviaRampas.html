<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia de Rampas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .screen { display: none; }
        .screen.active { display: flex; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
	
    <div id="main-container" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
        <h2 class="text-2 font-bold text-center mt-4" style="color: blue;">Proyecto Cinta Electrica</h2>
		<br>
        <!-- Pantalla de Inicio -->
        <div id="setup-screen" class="screen active flex-col text-center">
            <h1 class="text-2xl font-bold mb-4">¿Cuánto conoces sobre Rampas?</h1>
            <button onclick="iniciarJuego()" class="bg-blue-600 text-white py-2 rounded w-full hover:bg-blue-700">Comenzar</button>
        </div>

        <!-- Pantalla de Juego -->
        <div id="game-screen" class="screen flex-col">
            <p class="text-sm text-gray-500 mb-2 text-center">Pregunta <span id="q-num">1</span>/5</p>
            <h2 id="pregunta" class="text-lg font-semibold mb-4 text-center"></h2>
            <div id="opciones" class="space-y-2"></div>
            <div id="feedback" class="text-center font-bold text-red-600 mt-4 h-6"></div>
        </div>

        <!-- Pantalla de Resultados -->
        <div id="results-screen" class="screen flex-col text-center">
            <h2 class="text-xl font-bold mb-2">¡Terminado!</h2>
            <p id="final-time" class="text-lg mb-6"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white py-2 rounded w-full hover:bg-blue-700">Jugar de nuevo</button>
        </div>
		<br>
		<h2 class="font-bold text-center mt-4">Te invito a armar un rompecabezas</h2>
		<a href="https://luischavezt.github.io/ECD/rompecabezas.html" 
		   target="_blank" 
		   class="block w-full bg-green-600 text-white text-center py-2 rounded hover:bg-green-700 transition">
		   Jugar
		</a>
    </div>

    <script>
        const bancoPreguntas = [
            { q: "¿Que elementos de seguridad debe haber en los lados de las rampas?", o: ["Cintas antideslizantes", "Pasamos ergonomicos", "Cintas de seguridad"], a: 1 },
            { q: "¿Cual es el ancho libre que debe tener una rampa?", o: ["0.90 a 1.20", "1.00", "1.20 a 1.50"], a: 2 },
            { q: "¿Como debe ser la superficie de la Rampa?", o: ["De material antideslizante", "De Ceramico", "De Madera"], a: 0 },
            { q: "¿Como es la señalizacion de una rampa para discapacitados?", o: ["Una flecha verde", "Un triangulo de advertencia", "una silla de ruedas"], a: 2 },
            { q: "¿Cual consideras es el criterio correcto?", o: ["Mayor altura, mayor longitud de la rampa", "Menor altura, mayor longitud de rampa", "La longitud de rampa debe ser igual a la altura a subir"], a: 0 }
        ];

        let preguntasSeleccionadas = [];
        let state = { startTime: null, indice: 0 };

        function iniciarJuego() {
            state.startTime = Date.now();
            preguntasSeleccionadas = [...bancoPreguntas].sort(() => Math.random() - 0.5).slice(0, 5);
            
            document.getElementById("setup-screen").classList.remove("active");
            document.getElementById("game-screen").classList.add("active");
            mostrarPregunta();
        }

        function mostrarPregunta() {
            document.getElementById("feedback").innerText = "";
            if (state.indice < preguntasSeleccionadas.length) {
                document.getElementById("q-num").innerText = state.indice + 1;
                document.getElementById("pregunta").innerText = preguntasSeleccionadas[state.indice].q;
                const optDiv = document.getElementById("opciones");
                optDiv.innerHTML = "";
                preguntasSeleccionadas[state.indice].o.forEach((txt, i) => {
                    const btn = document.createElement("button");
                    btn.innerText = txt;
                    btn.className = "w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 transition";
                    btn.onclick = () => manejarRespuesta(i);
                    optDiv.appendChild(btn);
                });
            } else {
                terminarJuego();
            }
        }

        function manejarRespuesta(indiceElegido) {
            const feedback = document.getElementById("feedback");
            const esCorrecta = (indiceElegido === preguntasSeleccionadas[state.indice].a);

            if (esCorrecta) {
                feedback.className = "text-center font-bold text-green-600 mt-4 h-6";
                feedback.innerText = "¡Correcto!";
                
                // Esperar 800ms para mostrar el mensaje antes de avanzar
                setTimeout(() => {
                    state.indice++;
                    mostrarPregunta();
                }, 800);
            } else {
                feedback.className = "text-center font-bold text-red-600 mt-4 h-6";
                feedback.innerText = "¡Incorrecto! Inténtalo de nuevo.";
                // El usuario se queda en la misma pregunta si falla
            }
        }

        function terminarJuego() {
            const tiempoTotal = ((Date.now() - state.startTime) / 1000).toFixed(2);
            document.getElementById("game-screen").classList.remove("active");
            document.getElementById("results-screen").classList.add("active");
            document.getElementById("final-time").innerText = `Tu tiempo total: ${tiempoTotal} segundos`;
        }
    </script>
</body>
</html>
