<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Mapa de Lotes</title>
  
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css">
  <script src="https://js.arcgis.com/4.29/init.js"></script> 

  <style>
    html, body, #viewDiv { padding: 0; margin: 0; height: 100%; width: 100%; }
    
    /* Mantenemos la tarjeta fija abajo */
    .esri-popup__main-container {
      position: fixed !important;
      bottom: 20px !important;
      left: 10px !important;
      right: 10px !important;
      top: auto !important;
      width: auto !important;
      max-width: none !important;
      border-radius: 20px !important;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3) !important;
      z-index: 1000 !important;
    }
    .esri-popup__header-container, .esri-popup__footer, .esri-popup__pointer { 
      display: none !important; 
    }

    /* NUEVO ESTILO PARA BOTONES GRANDES Y VISIBLES */
    .btn-container { 
        display: flex; 
        gap: 15px; 
        margin: 20px 0; 
    }
    .btn-info { 
        flex: 1; 
        padding: 15px; 
        background: #f8f9fa; 
        border: 2px solid #e9ecef; 
        border-radius: 12px; 
        text-align: center; 
        font-weight: bold; 
        font-size: 16px;
        color: #333;
    }
  </style>
  
  <script>
    require([
      "esri/Map", "esri/views/MapView", "esri/layers/FeatureLayer", "esri/widgets/BasemapGallery"
    ], (Map, MapView, FeatureLayer, BasemapGallery) => {
      
      const map = new Map({ basemap: "streets-vector" });
      const view = new MapView({ container: "viewDiv", map: map, center: [-71.97, -13.52], zoom: 16 });

      view.ui.add(new BasemapGallery({ view: view }), "top-right");

      const popupTemplate = {
        title: "Lote {LOTE}, Manzana {MZ}", 
        content: `
          <div style="font-family: Arial, sans-serif; padding: 10px;">
            <p><b>Ubicación:</b> {URB}</p>
            <p><b>Vía:</b> {VIA}</p>
            <p><b>Numeración:</b> {NUMERACION}</p>
            
            <div class="btn-container">
                <div class="btn-info">S/ {PRECIO}</div>
                <div class="btn-info">{AREA} m²</div>
            </div>

            <a href="https://wa.me/51984310233?text=Hola, quiero información sobre el Lote {LOTE} de la Manzana {MZ}" 
               target="_blank"
               style="display: block; padding: 18px; background: #25D366; color: white; text-decoration: none; border-radius: 12px; font-weight: bold; text-align: center; font-size: 16px;">
               Contactar por WhatsApp
            </a>
          </div>
        `
      };

      const lotesLayer = new FeatureLayer({
        url: "https://services8.arcgis.com/2qDHoDLqu6VOlf1y/arcgis/rest/services/LOTES_PRUEBA/FeatureServer/0",
        popupTemplate: popupTemplate
      });

      map.add(lotesLayer);
      lotesLayer.when(() => lotesLayer.queryExtent()).then((response) => view.goTo(response.extent));
    });
  </script>
</head>
<body>
  <div id="viewDiv"></div>
</body>
</html>
