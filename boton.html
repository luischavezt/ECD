<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Botón de Alerta 3s</title>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #151e32;
      --text: #f8fafc;
      --muted: #94a3b8;
      --red: #dc2626;
      --red-active: #991b1b;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #f87171;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .gps-badge {
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      font-size: 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .gps-badge.ready {
      color: var(--ok);
    }

    .center-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .hold-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 5px solid rgba(255, 255, 255, 0.18);
      background: var(--red);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      line-height: 1.3;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 14px 36px rgba(220, 38, 38, 0.4);
      transition: transform 0.1s ease, background-color 0.1s ease, opacity 0.2s ease;
    }

    .hold-btn.holding {
      transform: scale(0.95);
      background: var(--red-active);
    }

    .hold-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .meter {
      width: 230px;
      height: 10px;
      border-radius: 999px;
      background: var(--panel);
      overflow: hidden;
    }

    .meter-fill {
      width: 0%;
      height: 100%;
      background: #ef4444;
      transition: width 0.04s linear;
    }

    .status {
      min-height: 44px;
      max-width: 340px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .status.ok {
      color: var(--ok);
      font-weight: 600;
    }

    .status.warn {
      color: var(--warn);
    }

    .status.err {
      color: var(--err);
    }

    .footer-note {
      font-size: 0.78rem;
      color: var(--muted);
      max-width: 340px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <div id="gpsBadge" class="gps-badge">Obteniendo ubicación...</div>
    </div>

    <div class="center-zone">
      <button id="holdBtn" class="hold-btn" type="button">
        PRESIONAR<br />PARA ENVIAR
      </button>

      <div class="meter">
        <div id="meterFill" class="meter-fill"></div>
      </div>

      <div id="status" class="status">
        Mantén presionado 3 segundos sin soltar.
      </div>
    </div>

    <div class="footer-note">
      Envío directo a la capa de recepción de alertas.
    </div>
  </div>

  <script>
    // CONFIGURA AQUÍ TU FEATURE LAYER DE ARCGIS ONLINE
    const CONFIG = {
      addFeaturesUrl:
        "https://services8.arcgis.com/2qDHoDLqu6VOlf1y/arcgis/rest/services/Emergencia/FeatureServer/0/addFeatures",
      holdMs: 3000,
      cooldownMs: 5000, // Bloquea ráfagas accidentales tras un envío exitoso
      fields: {
        tipo: "tipo_alerta",
        precision: "precision_m",
        fecha: "fecha_hora"
      },
      valorTipo: "ALERTA_RAPIDA"
    };

    const holdBtn = document.getElementById("holdBtn");
    const meterFill = document.getElementById("meterFill");
    const statusEl = document.getElementById("status");
    const gpsBadge = document.getElementById("gpsBadge");

    let currentCoords = null;
    let holdStart = null;
    let animFrame = null;
    let isSending = false;
    let isCooldown = false;

    function setStatus(msg, level = "") {
      statusEl.textContent = msg;
      statusEl.className = `status ${level}`.trim();
    }

    // 1. PRECARGA Y ACTUALIZACIÓN CONTINUA DEL GPS DESDE EL INICIO
    function initLocationWatcher() {
      if (!("geolocation" in navigator)) {
        gpsBadge.textContent = "Sin GPS en navegador";
        setStatus("Este dispositivo no soporta geolocalización.", "err");
        return;
      }

      navigator.geolocation.watchPosition(
        (pos) => {
          currentCoords = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            acc: pos.coords.accuracy,
            ts: pos.timestamp
          };
          gpsBadge.textContent = `GPS listo (±${Math.round(pos.coords.accuracy)} m)`;
          gpsBadge.classList.add("ready");
        },
        (err) => {
          gpsBadge.classList.remove("ready");
          gpsBadge.textContent = "GPS pendiente / sin permiso";
          setStatus(`Activa el GPS o permiso de ubicación (${err.message}).`, "warn");
        },
        {
          enableHighAccuracy: true,
          maximumAge: 2000,
          timeout: 8000
        }
      );
    }

    // Intento rápido de lectura si el usuario presiona antes del primer watchPosition
    function readPositionNow() {
      return new Promise((resolve, reject) => {
        if (!("geolocation" in navigator)) {
          reject(new Error("Geolocalización no disponible"));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) =>
            resolve({
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              acc: pos.coords.accuracy,
              ts: pos.timestamp
            }),
          (err) => reject(err),
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 4000 }
        );
      });
    }

    // 2. ENVÍO DIRECTO A ARCGIS ONLINE (addFeatures)
    async function postToArcGIS(coords) {
      const feature = {
        geometry: {
          x: coords.lng,
          y: coords.lat,
          spatialReference: { wkid: 4326 }
        },
        attributes: {
          [CONFIG.fields.tipo]: CONFIG.valorTipo,
          [CONFIG.fields.precision]: Math.round(coords.acc),
          [CONFIG.fields.fecha]: Date.now()
        }
      };

      const params = new URLSearchParams();
      params.append("f", "json");
      params.append("features", JSON.stringify([feature]));

      const res = await fetch(CONFIG.addFeaturesUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
        },
        body: params.toString()
      });

      if (!res.ok) {
        throw new Error(`Error de red (${res.status})`);
      }

      const data = await res.json();
      const result = data?.addResults?.[0];

      if (!result || !result.success) {
        const detail =
          result?.error?.description ||
          data?.error?.message ||
          "ArcGIS rechazó el registro";
        throw new Error(detail);
      }

      return result.objectId;
    }

    // 3. DISPARO AL COMPLETAR LOS 3 SEGUNDOS
    async function triggerSend() {
      if (isSending || isCooldown) return;

      isSending = true;
      holdBtn.disabled = true;
      holdBtn.classList.remove("holding");
      meterFill.style.width = "100%";
      setStatus("Enviando ubicación...", "warn");

      try {
        let coords = currentCoords;
        if (!coords) {
          coords = await readPositionNow();
          currentCoords = coords;
        }

        const oid = await postToArcGIS(coords);
        setStatus(
          `Enviado (#${oid}) · ${coords.lat.toFixed(5)}, ${coords.lng.toFixed(5)}`,
          "ok"
        );

        // Cooldown anti-ráfaga tras envío exitoso
        isCooldown = true;
        setTimeout(() => {
          isCooldown = false;
          holdBtn.disabled = false;
          meterFill.style.width = "0%";
        }, CONFIG.cooldownMs);
      } catch (err) {
        setStatus(`Error al enviar: ${err.message}`, "err");
        holdBtn.disabled = false;
        meterFill.style.width = "0%";
      } finally {
        isSending = false;
      }
    }

    // 4. TEMPORIZADOR DE PULSACIÓN SOSTENIDA
    function tickHold(now) {
      if (holdStart === null || isSending || isCooldown) return;

      const elapsed = now - holdStart;
      const pct = Math.min(100, (elapsed / CONFIG.holdMs) * 100);
      meterFill.style.width = `${pct}%`;

      if (elapsed >= CONFIG.holdMs) {
        cancelAnimationFrame(animFrame);
        animFrame = null;
        holdStart = null;
        triggerSend();
        return;
      }

      animFrame = requestAnimationFrame(tickHold);
    }

    function onPressStart(e) {
      e.preventDefault();
      if (isSending || isCooldown || holdStart !== null) return;

      holdStart = performance.now();
      holdBtn.classList.add("holding");
      setStatus("Mantén presionado hasta completar 3 segundos...");
      animFrame = requestAnimationFrame(tickHold);
    }

    function onPressEnd() {
      if (holdStart === null || isSending) return;
      if (animFrame) cancelAnimationFrame(animFrame);
      animFrame = null;
      holdStart = null;
      holdBtn.classList.remove("holding");
      if (!isCooldown) {
        meterFill.style.width = "0%";
        setStatus("Se soltó antes de 3 segundos. Vuelve a mantener presionado.");
      }
    }

    holdBtn.addEventListener("pointerdown", onPressStart);
    holdBtn.addEventListener("pointerup", onPressEnd);
    holdBtn.addEventListener("pointercancel", onPressEnd);
    holdBtn.addEventListener("pointerleave", onPressEnd);

    initLocationWatcher();
  </script>
</body>
</html>
